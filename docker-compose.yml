services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clubmanager}
      POSTGRES_USER: ${POSTGRES_USER:-clubmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clubmanager_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clubmanager} -d ${POSTGRES_DB:-clubmanager}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [club_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [club_net]

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://clubmanager:clubmanager_dev_password@db:5432/clubmanager}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${PORT:-3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [club_net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped
    networks: [club_net]

volumes:
  postgres_data:
  redis_data:

networks:
  club_net:
    driver: bridge
